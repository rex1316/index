<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e8eaf1;--ac:#4361ee;--acs:#eef1ff;--ok:#12a47a;--no:#e5484d;--wr:#f59f00;--nw:#9aa4b8;--sh:0 1px 2px rgba(15,23,42,.04),0 10px 28px rgba(15,23,42,.07);--sb:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d13;--card:#151925;--ink:#eef1f8;--mut:#8b95a9;--line:#232838;--acs:#1c2240;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(100px + var(--sb))}
.pg{display:none;padding:max(env(safe-area-inset-top),18px) 18px 0;max-width:520px;margin:0 auto}
.pg.on{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px}
.sub{font-size:13px;color:var(--mut);margin-bottom:18px}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.lab{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--mut);margin-bottom:10px}
.hint{font-size:12.5px;color:var(--mut);line-height:1.6;margin:6px 0}
input,textarea{width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink);outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:100px;resize:none;margin-bottom:10px}
button{font-family:inherit;border:none;cursor:pointer;transition:transform .12s,opacity .2s}
button:active{transform:scale(.97);opacity:.9}
.pri{background:linear-gradient(135deg,#4361ee,#6d4aff);color:#fff;font-size:16px;font-weight:600;border-radius:14px;padding:0 20px;min-height:48px}
.wide{width:100%}
.gho{background:var(--bg);color:var(--ink);font-size:15px;border-radius:14px;min-height:46px;padding:0 16px}
.srch{display:flex;gap:8px}.srch input{flex:1}
.hero{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;position:relative}
.ring{width:170px;height:170px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}.r0{stroke:var(--line)}.r1{stroke:var(--ac);transition:stroke-dashoffset .8s ease}
.rc{position:absolute;top:50px;text-align:center}.rc b{display:block;font-size:44px;font-weight:700;letter-spacing:-1px}.rc span{font-size:13px;color:var(--mut)}
.trio{display:flex;gap:8px;margin:12px 0 16px}.trio div{flex:1;text-align:center;background:var(--bg);border-radius:14px;padding:10px 4px}.trio b{display:block;font-size:19px}.trio span{font-size:11.5px;color:var(--mut)}
.prac{display:flex;gap:8px;margin-top:10px}.prac button{flex:1;font-size:14.5px;padding:0 6px}
.fl{perspective:1400px;margin-bottom:14px}
.fi{position:relative;height:320px;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fl.on .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;overflow:auto}
.fb{transform:rotateY(180deg)}
.big{font-size:38px;font-weight:700;letter-spacing:-.5px;word-break:break-word}
.ipa{font-size:17px;color:var(--mut)}.zh{font-size:26px;font-weight:600}.ex{font-size:14.5px;color:var(--mut);font-style:italic;line-height:1.5}
.spk{background:var(--acs);color:var(--ac);border-radius:20px;padding:7px 16px;font-size:14px}
.rate{display:flex;gap:10px}.rate button{flex:1;min-height:54px;border-radius:16px;font-size:16px;font-weight:600;background:var(--card);box-shadow:var(--sh)}
.rate .n{color:var(--no)}.rate .y{color:var(--ok)}.rate .v{color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .m{flex:1;min-width:0}.row .w{font-size:17px;font-weight:600}.row .d{font-size:13.5px;color:var(--mut);margin-top:2px}.row .e{font-size:12px;color:var(--mut);margin-top:4px}
.row[class*="st-"]{border-left:4px solid var(--nw);padding-left:10px;border-radius:2px}
.st-hard{border-left-color:var(--no)!important}.st-warn{border-left-color:var(--wr)!important}.st-learn{border-left-color:var(--ac)!important}.st-fam{border-left-color:var(--ok)!important}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;color:#fff;background:var(--nw)}
.p-hard{background:var(--no)}.p-warn{background:var(--wr)}.p-learn{background:var(--ac)}.p-fam{background:var(--ok)}
.gh{display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer}.gh .t{flex:1}.gh .w{font-size:17px;font-weight:600}.gh .d{font-size:13px;color:var(--mut);margin-top:2px}.chev{color:var(--mut);font-size:18px}
.gact{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 10px}.gact button{flex:1 1 40%;min-height:40px;font-size:14px}
.x{background:none;color:var(--mut);font-size:22px;padding:4px 8px}
.res .big{font-size:32px}.src{font-size:12px;color:var(--mut);margin-top:6px}
.mi{margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.chip{background:var(--acs);color:var(--ac);border-radius:16px;padding:6px 14px;font-size:14px}
.bar{position:fixed;left:16px;right:16px;bottom:calc(12px + var(--sb));max-width:488px;margin:0 auto;height:64px;display:flex;background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;box-shadow:var(--sh);border:1px solid var(--line)}
.t{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}
.t.on{color:var(--ac)}.t svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mut);padding:36px 10px;line-height:1.8;font-size:15px}
.chk{width:22px;height:22px;accent-color:var(--ac);flex:none}
.seg{display:flex;background:var(--card);border-radius:14px;padding:3px;box-shadow:var(--sh)}.seg button{flex:1;background:none;color:var(--mut);border-radius:11px;min-height:40px;font-size:14px}.seg button.on{background:var(--acs);color:var(--ac);font-weight:600}
.lk{color:var(--ac);text-decoration:none}

</head>
<body>
<div class="pg on" id="p-today"></div>
<div class="pg" id="p-add">
  <h1>添加</h1><div class="sub">查词、提取、粘贴，三种方式</div>
  <div class="card"><div class="lab">查词</div>
    <div class="srch"><input id="q" placeholder="输入英文，例如 like" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="pri" onclick="doLookup()">查询</button></div>
    <div id="qres"></div></div>
  <div class="card"><div class="lab">从文章提取生词</div>
    <textarea id="art" placeholder="粘贴英文课文或文章……"></textarea>
    <button class="pri wide" onclick="extract()">提取生词</button><div id="ext"></div></div>
  <div class="card"><div class="lab">批量粘贴</div>
    <div class="hint">一行一个：admit /ədˈmɪt/ 承认　或　英文，中文，例句</div>
    <textarea id="bulk"></textarea><button class="pri wide" onclick="bulkAdd()">添加</button><div id="bmsg" class="hint"></div></div>
</div>
<div class="pg" id="p-list">
  <h1>词库</h1><div class="sub" id="lsub"></div>
  <input id="ls" placeholder="搜索英文或中文" oninput="renderList()" style="margin-bottom:12px">
  <div class="seg" id="lseg" style="margin-bottom:14px"></div>
  <div id="lst"></div>
</div>
<div class="pg" id="p-me">
  <h1>我的</h1><div class="sub">数据只保存在这台手机上</div>
  <div class="card"><div class="lab">复习方向</div>
    <div class="seg" style="box-shadow:none;background:var(--bg)"><button id="d-en" onclick="setDir('en')">看英文想中文</button><button id="d-zh" onclick="setDir('zh')">看中文想英文</button></div></div>
  <div class="card"><div class="lab">词典包</div>
    <div class="hint">粘贴词典包（每行：单词 /音标/ 中文）。只用于查词，不会进入复习词库。已导入 <span id="dn">0</span> 个。</div>
    <textarea id="dp"></textarea><button class="pri wide" onclick="importDict()">导入词典包</button><div id="dm" class="hint"></div></div>
  <div class="card"><div class="lab">备份</div>
    <div class="hint">定期复制备份，存进备忘录。换手机或清理数据前一定要做。</div>
    <div style="display:flex;gap:8px"><button class="gho" style="flex:1" onclick="exportAll()">复制备份</button><button class="gho" style="flex:1" onclick="importBackup()">粘贴恢复</button></div>
    <textarea id="bk" placeholder="恢复时把备份粘贴到这里，再点“粘贴恢复”" style="margin-top:10px;margin-bottom:0"></textarea><div id="bkm" class="hint"></div></div>
  <div class="card"><button class="gho wide" style="color:var(--no)" onclick="clearAll()">清空全部数据</button></div>
</div>

<nav class="bar">
  <button class="t on" id="t-today" onclick="tab('today')"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>今日</button>
  <button class="t" id="t-add" onclick="tab('add')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加</button>
  <button class="t" id="t-list" onclick="tab('list')"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM8 3v16"/></svg>词库</button>
  <button class="t" id="t-me" onclick="tab('me')"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>我的</button>
</nav>
<div class="toast" id="toast"></div>

  var en=cfg.dir==='en',f=en?'<div class="big">'+esc(cur.en)+'</div>'+(cur.phonetic?'<div class="ipa">'+esc(cur.phonetic)+'</div>':'')+'<button class="spk" onclick="speak(cur.en)">🔊 发音</button>':'<div class="zh">'+esc(cur.zh)+'</div>';
  var b=en?'<div class="zh">'+esc(cur.zh)+'</div>':'<div class="big">'+esc(cur.en)+'</div>'+(cur.phonetic?'<div class="ipa">'+esc(cur.phonetic)+'</div>':'')+'<button class="spk" onclick="speak(cur.en)">🔊 发音</button>';
  if(cur.ex)b+='<div class="ex">'+esc(cur.ex)+'</div>';
  var lab=mode==='loop'?'循环 · 已答 '+loopN+' 次 · '+loopPool.filter(function(w){return !w.fam}).length+' 个词':'复习 · 还剩 '+(queue.length+1)+' 个';
  el.innerHTML='<div class="sub" style="margin-top:10px;display:flex;justify-content:space-between"><span>'+lab+'</span><span>'+(hist.length?'<a href="#" class="lk" onclick="undo();return false">撤销上一个</a>　':'')+'<a href="#" class="lk" onclick="renderToday();return false">结束</a></span></div>'
   +'<div class="fl" id="fl"><div class="fi"><div class="fa">'+f+'</div><div class="fb">'+b+'</div></div></div>'
   +'<button class="pri wide" id="rv" onclick="flipCard()">显示答案</button>'
   +'<div id="rate" style="display:none"><div class="rate"><button class="n" onclick="grade(\'no\')">不认识</button><button class="v" onclick="grade(\'vague\')">模糊</button><button class="y" onclick="grade(\'know\')">认识</button></div><button class="gho wide" style="margin-top:10px;color:var(--ok)" onclick="markFam()">✓ 完全熟悉（不再出现）</button></div>';
  if(en)setTimeout(function(){speak(cur.en)},250)}
function flipCard(){$('fl').classList.add('on');$('rv').style.display='none';$('rate').style.display='block';if(cfg.dir==='zh')speak(cur.en)}
function snap(w){return{level:w.level,nextReview:w.nextReview,seen:w.seen,fam:w.fam,rev:w.rev,wrong:w.wrong,streak:w.streak,hard:w.hard,last:w.last}}
function restore(w,s){['level','nextReview','seen','fam','rev','wrong','streak','hard','last'].forEach(function(k){if(s[k]===undefined)delete w[k];else w[k]=s[k]})}
function pushHist(h){hist.push(h);if(hist.length>30)hist.shift()}
function grade(g){var w=cur;if(!w)return;var k=w.en;
  var h={w:w,s:snap(w),pv:vq[k],pc:conf[k],pushed:false,counted:false,rc:recent.slice()};
  var due_=mode==='due',cs=(g==='know'&&due_&&!w.seen&&!conf[k]);
  if(cs){conf[k]=1;queue.push(w);h.pushed=true;toast('新词，再确认一次')}
  else{
    w.rev=(w.rev||0)+1;w.seen=1;w.last=g;
    if(g==='know'){w.streak=(w.streak||0)+1;if(w.hard&&w.streak>=3)w.hard=false;
      if(due_){w.level=Math.min((w.level||0)+1,5);w.nextReview=dayStart(LADDER[w.level])}}
    else if(g==='vague'){w.streak=0;w.fam=false;
      if(due_){w.nextReview=dayStart(LADDER[w.level||0]);if(!vq[k]){vq[k]=1;queue.push(w);h.pushed=true}}
      else{w.level=Math.max(0,(w.level||0)-1);w.nextReview=Math.min(w.nextReview||0,dayStart(1))}}
    else{w.streak=0;w.fam=false;w.wrong=(w.wrong||0)+1;if(w.wrong>=3)w.hard=true;w.level=0;w.nextReview=dayStart(1);
      if(due_){queue.push(w);h.pushed=true}}
    if(due_){cnt++;h.counted=true;jset('index_today',cnt)}else loopN++}
  log.a.push({en:k,g:g});jset('index_log',log);pushHist(h);save();nextCard()}
function markFam(){var w=cur;if(!w)return;
  var h={w:w,s:snap(w),pv:vq[w.en],pc:conf[w.en],pushed:false,counted:false,rc:recent.slice()};
  w.fam=true;w.hard=false;w.level=5;w.nextReview=dayStart(35);w.seen=1;w.rev=(w.rev||0)+1;w.streak=(w.streak||0)+1;w.last='know';
  var i=queue.indexOf(w);while(i>=0){queue.splice(i,1);i=queue.indexOf(w)}
  if(mode==='due'){cnt++;h.counted=true;jset('index_today',cnt)}else loopN++;
  log.a.push({en:w.en,g:'fam'});jset('index_log',log);pushHist(h);save();nextCard()}
function undo(){var h=hist.pop();if(!h)return;var w=h.w,k=w.en;restore(w,h.s);
  if(h.pv===undefined)delete vq[k];else vq[k]=h.pv;
  if(h.pc===undefined)delete conf[k];else conf[k]=h.pc;
  if(h.pushed){var i=queue.lastIndexOf(w);if(i>=0)queue.splice(i,1)}
  if(h.counted){cnt=Math.max(0,cnt-1);jset('index_today',cnt)}
  if(mode==='loop'){loopN=Math.max(0,loopN-1);recent=h.rc||recent}
  log.a.pop();jset('index_log',log);
  if(cur&&mode==='due')queue.unshift(cur);cur=w;save();renderCard()}

/* 添加：查词 */
function addWord(en,ipa,zh,ex){en=en.trim();zh=zh.trim();if(!en||!zh)return false;
  var i=W.findIndex(function(w){return w.en.toLowerCase()===en.toLowerCase()});
  if(i>=0){W[i].zh=zh;if(ipa)W[i].phonetic=ipa;if(ex)W[i].ex=ex}
  else W.push({en:en,phonetic:ipa||'',zh:zh,ex:ex||'',level:0,nextReview:0,added:Date.now(),rev:0,wrong:0,streak:0,last:''});
  save();return true}
function showRes(q,r,tag,cs){
  found={en:q,ipa:r.ipa||''};cands=cs||[];
  var h='<div class="res" style="margin-top:14px;text-align:center"><div class="big">'+esc(q)+'</div>'+(r.ipa?'<div class="ipa">/'+esc(r.ipa)+'/</div>':'')
   +'<input class="mi" id="fz" value="'+esc(r.zh)+'" placeholder="中文意思（可修改）" style="text-align:center;font-size:20px">';
  if(cands.length>1)h+='<div class="chips">'+cands.map(function(c,i){return '<button class="chip" onclick="pickC('+i+')">'+esc(c)+'</button>'}).join('')+'</div>';
  h+='<div class="src">'+esc(tag||r.src)+'</div><div style="display:flex;gap:8px;margin-top:12px"><button class="gho" style="flex:1" onclick="speak(found.en)">🔊 发音</button><button class="pri" style="flex:2" onclick="addFound()">加入复习</button></div></div>';
  $('qres').innerHTML=h}
function pickC(i){$('fz').value=cands[i]}
function addFound(){if(!found)return;var z=$('fz').value;if(!z.trim())return toast('请填写中文意思');
  addWord(found.en,found.ipa?'/'+found.ipa+'/':'',z,'');$('q').value='';toast('已加入「'+found.en+'」')}
function doLookup(){
  var q=$('q').value.trim().toLowerCase();if(!q)return;
  var r=find(q);if(r){showRes(q,r);return}
  $('qres').innerHTML='<div class="hint" style="text-align:center;margin-top:14px">内置词典里没有，正在联网查询……</div>';
  online(q).then(function(v){
    if(v){showRes(q,{ipa:'',zh:v[0]},'在线机翻，仅供参考。可点选其他意思或直接修改',v);return}
    showRes(q,{ipa:'',zh:''},'内置词典和在线都没查到，请自己填中文意思')})}

/* 添加：文章提取 */
function extract(){
  var t=$('art').value;if(!t.trim())return toast('请先粘贴文章');
  var have={};W.forEach(function(w){have[w.en.toLowerCase()]=1});
  var sen=t.split(/[.!?\n]+/),map={};
  (t.match(/[A-Za-z]+(?:'[a-z]+)?/g)||[]).forEach(function(r){var w=r.toLowerCase().replace(/'.*$/,'');if(w.length<3||STOP.has(w)||have[w])return;map[w]=(map[w]||0)+1});
  extRows=Object.keys(map).map(function(w){
    var s=sen.find(function(x){return new RegExp('\\b'+w+'\\b','i').test(x)})||'',r=find(w);
    return{w:w,n:map[w],ex:s.trim(),ipa:dget(w)?dget(w)[0]:'',zh:r?r.zh:''}}).sort(function(a,b){return b.n-a.n||(a.w<b.w?-1:1)}).slice(0,150);
  if(!extRows.length){$('ext').innerHTML='<div class="hint">没有发现新的生词。</div>';return}
  var h='<div class="hint" style="margin-top:12px">共 '+extRows.length+' 个。勾选要学的词，中文意思空着的需要自己补上。</div>';
  extRows.forEach(function(r,i){h+='<div class="row"><input type="checkbox" class="chk" id="c'+i+'"><div class="m"><div class="w">'+esc(r.w)+(r.n>1?' <span style="font-weight:400;font-size:12px;color:var(--mut)">×'+r.n+'</span>':'')+'</div><input class="mi" id="z'+i+'" value="'+esc(r.zh)+'" placeholder="中文意思"><div class="e">'+esc(r.ex)+'</div></div></div>'});
  $('ext').innerHTML=h+'<button class="pri wide" style="margin-top:12px" onclick="addExt()">加入所选</button>'}
function addExt(){var a=0,s=0;
  extRows.forEach(function(r,i){if(!$('c'+i).checked)return;var z=$('z'+i).value;
    if(addWord(r.w,r.ipa?'/'+r.ipa+'/':'',z,r.ex))a++;else s++});
  toast('加入 '+a+' 个'+(s?'，'+s+' 个没填中文被跳过':''));if(a)extract()}

/* 添加：批量粘贴 */
function parse(line){
  line=line.trim();if(!line)return null;
  var m=line.match(/^([A-Za-z][A-Za-z' \-\.]*?)\s*(\/[^\/]+\/)?\s*([\u4e00-\u9fff（(].*)$/),en,ph='',zh,ex='';
  if(m){en=m[1];ph=m[2]||'';zh=m[3]}
  else{var p=line.split(/[,，\t]/).map(function(s){return s.trim()});
    if(p.length<2||!p[0])return null;en=p[0];
    if(p[1].charAt(0)==='/'){ph=p[1];zh=p[2]||'';ex=p.slice(3).join(', ')}else{zh=p[1];ex=p.slice(2).join(', ')}}
  var q=zh.split('|');zh=q[0].trim();if(q.length>1)ex=q.slice(1).join('|').trim();
  if(!en||!zh)return null;return{en:en.trim(),ph:ph,zh:zh,ex:ex}}
function bulkAdd(){var t=$('bulk').value,a=0,s=0;if(!t.trim())return;
  if(t.trim().charAt(0)==='['){var r=importJSON(t);$('bmsg').textContent=r===null?'备份格式看不懂。':'已导入 '+r+' 个。';$('bulk').value='';return}
  var have={};W.forEach(function(w){have[w.en.toLowerCase()]=1});
  t.split('\n').forEach(function(l){if(!l.trim())return;var p=parse(l);if(!p||have[p.en.toLowerCase()]){s++;return}have[p.en.toLowerCase()]=1;addWord(p.en,p.ph,p.zh,p.ex);a++});
  $('bmsg').textContent='加入 '+a+' 个'+(s?'，跳过 '+s+' 行（重复或格式看不懂）':'')+'。';$('bulk').value=''}
function importJSON(t){var arr;try{arr=JSON.parse(t)}catch(e){return null}if(!Array.isArray(arr))return null;var a=0;
  arr.forEach(function(w){if(!w||!w.en||!w.zh)return;var i=W.findIndex(function(x){return x.en.toLowerCase()===String(w.en).toLowerCase()});
    var n={en:w.en,phonetic:w.phonetic||'',zh:w.zh,ex:w.ex||'',level:w.level||0,nextReview:w.nextReview||0,added:w.added,rev:w.rev||0,wrong:w.wrong||0,streak:w.streak||0,hard:w.hard,fam:w.fam,last:w.last||'',seen:w.seen};
    if(i>=0)W[i]=n;else W.push(n);a++});
  save();return a}

/* 词库 */
function rowHtml(i){var w=W[i],s=st(w),n=Date.now(),d=new Date(w.nextReview);
  var when=!(w.rev>0||w.seen)?'未复习':(w.nextReview<=n?'待复习':(d.getMonth()+1)+'月'+d.getDate()+'日复习');
  return '<div class="row st-'+s+'"><div class="m"><div class="w">'+esc(w.en)+' <span class="ipa" style="font-size:13px">'+esc(w.phonetic)+'</span></div><div class="d">'+esc(w.zh)+'</div><div class="e"><span class="pill p-'+s+'">'+STN[s]+'</span> 复习 '+w.rev+' 次 · 错 '+w.wrong+' 次 · '+when+'</div></div><button class="spk" onclick="speak(W['+i+'].en)">🔊</button><button class="x" title="拉回复习" onclick="pullIdx('+i+',false)">↺</button><button class="x" onclick="delW('+i+')">×</button></div>'}
function setLt(t){lt=t;renderList()}
function tg(k){openG[k]=!openG[k];renderList()}
function renderList(){
  var q=$('ls').value.trim().toLowerCase(),h='';
  var hardN=W.filter(function(w){return w.hard&&!w.fam}).length,famN=W.filter(function(w){return w.fam}).length;
  $('lsub').textContent='共 '+W.length+' 个单词';
  $('lseg').innerHTML='<button class="'+(lt==='date'?'on':'')+'" onclick="setLt(\'date\')">按日期</button><button class="'+(lt==='hard'?'on':'')+'" onclick="setLt(\'hard\')">难词本 '+hardN+'</button><button class="'+(lt==='fam'?'on':'')+'" onclick="setLt(\'fam\')">已熟悉 '+famN+'</button>';
  function ok(w){return !q||(w.en+' '+w.zh).toLowerCase().indexOf(q)>=0}
  if(lt==='date'){
    groups().forEach(function(g){var ix=g.ix.filter(function(i){return ok(W[i])});if(!ix.length)return;
      var fm=ix.filter(function(i){return W[i].fam}).length,hd=ix.filter(function(i){return W[i].hard&&!W[i].fam}).length,op=openG[g.k]||q;
      h+='<div class="card" style="padding:6px 16px"><div class="gh" onclick="tg(\''+g.k+'\')"><div class="t"><div class="w">'+esc(gname(g.k))+(cfg.gn[g.k]?' <span class="d" style="font-weight:400">'+glabel(g.k)+'</span>':'')+'</div><div class="d">'+ix.length+' 个词 · 熟悉 '+fm+(hd?' · 难词 '+hd:'')+'</div></div><span class="chev">'+(op?'▾':'▸')+'</span></div>';
      if(op){h+='<div class="gact"><button class="gho" onclick="loopGroup(\''+g.k+'\')">循环复习</button><button class="gho" onclick="pullGroup(\''+g.k+'\')">整组拉回</button><button class="gho" onclick="resetGroup(\''+g.k+'\')">重新学</button><button class="gho" onclick="renameGroup(\''+g.k+'\')">改名</button></div>';ix.forEach(function(i){h+=rowHtml(i)})}
      h+='</div>'})
  }else{
    var arr=[];W.forEach(function(w,i){if(ok(w)&&(lt==='hard'?(w.hard&&!w.fam):w.fam))arr.push(i)});
    if(lt==='hard'&&arr.length)h+='<button class="pri wide" style="margin-bottom:12px" onclick="loopHard()">练习难词</button>';
    h+=arr.length?'<div class="card">'+arr.map(function(i){return rowHtml(i)}).join('')+'</div>':'<div class="empty">'+(lt==='hard'?'还没有难词。错 3 次以上的词会自动进来，连续答对 3 次再移出。':'还没有完全熟悉的词。')+'</div>'}
  $('lst').innerHTML=h||'<div class="empty">没有找到单词。</div>'}
function loopGroup(k){var a=wordsOf(k).filter(function(w){return !w.fam});if(!a.length)return toast('这一组都已完全熟悉');tab('today');startLoop(a)}
function loopHard(){var a=W.filter(function(w){return w.hard&&!w.fam});if(!a.length)return;tab('today');startLoop(a)}
function pullGroup(k){wordsOf(k).forEach(function(w){w.nextReview=0;w.fam=false});save();toast('整组已拉回，今天就能复习');renderList()}
function resetGroup(k){if(!confirm('把这一组所有词的进度清零，重新开始学？'))return;wordsOf(k).forEach(function(w){w.level=0;w.nextReview=0;w.fam=false;w.hard=false;w.rev=0;w.wrong=0;w.streak=0;w.last='';delete w.seen});save();toast('已重新开始');renderList()}
function renameGroup(k){var v=prompt('给这一组起个名字（留空恢复日期）：',cfg.gn[k]||glabel(k));if(v===null)return;v=v.trim();if(v&&v!==glabel(k))cfg.gn[k]=v;else delete cfg.gn[k];save();renderList()}
function delW(i){var w=W[i];if(!w||!confirm('删除「'+w.en+'」？'))return;W.splice(i,1);save();renderList()}

/* 我的 */
function renderMe(){$('d-en').classList.toggle('on',cfg.dir==='en');$('d-zh').classList.toggle('on',cfg.dir==='zh');$('dn').textContent=Object.keys(UD).length}
function setDir(d){cfg.dir=d;save();renderMe()}
function importDict(){var t=$('dp').value,a=0,s=0;
  t.split('\n').forEach(function(l){if(!l.trim())return;var p=parse(l);if(!p){s++;return}UD[p.en.toLowerCase()]=[p.ph.replace(/\//g,''),p.zh];a++});
  jset('index_dict',UD);$('dp').value='';$('dm').textContent='导入 '+a+' 个'+(s?'，跳过 '+s+' 行':'')+'。';renderMe()}
function exportAll(){var s=JSON.stringify(W);$('bk').value=s;$('bk').select();var ok=false;try{navigator.clipboard.writeText(s);ok=true}catch(e){}$('bkm').textContent=ok?'已复制，请粘贴到备忘录保存。':'请长按上面的文字，全选复制，存进备忘录。'}
function importBackup(){var r=importJSON($('bk').value);$('bkm').textContent=r===null?'备份格式看不懂。':'已恢复 '+r+' 个单词。'}
function clearAll(){if(!confirm('确定清空全部单词和记录？建议先复制备份。'))return;W=[];cnt=0;jset('index_today',0);log={d:todayS,a:[]};jset('index_log',log);save();toast('已清空')}

renderToday();renderMe();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
